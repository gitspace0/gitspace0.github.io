<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitSpace - Local Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased min-h-screen flex flex-col">

  <header class="bg-gray-900 text-white p-4 shadow-md">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <svg class="w-8 h-8 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"></path></svg>
        <h1 class="text-2xl font-bold tracking-tight">GitSpace <span class="text-sm font-normal text-gray-400">Local</span></h1>
      </div>
      <span class="bg-gray-800 px-3 py-1.5 rounded-full border border-gray-700 text-sm">Local Device User</span>
    </div>
  </header>

  <main class="flex-grow max-w-6xl w-full mx-auto p-6 mt-4">
    
    <div class="mb-8 border-b border-gray-200 pb-4">
      <h2 class="text-3xl font-bold">My Local Space</h2>
      <p class="text-gray-500 mt-2">Files are saved directly to this browser. No servers required.</p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <div class="lg:col-span-2">
        <div class="border border-gray-200 rounded-lg bg-white shadow-sm overflow-hidden">
          <div class="bg-gray-100 px-4 py-3 border-b border-gray-200 flex justify-between items-center">
            <span class="font-mono text-sm font-semibold text-gray-700">Directory: /</span>
            <button onclick="clearAllFiles()" class="text-xs text-red-500 hover:text-red-700 font-medium">Clear All Data</button>
          </div>
          
          <ul id="fileList" class="divide-y divide-gray-100">
            </ul>
        </div>
      </div>

      <div>
        <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
          <h3 class="text-lg font-bold mb-4 border-b pb-2">Save to Browser</h3>
          
          <div class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">1. Choose a text/code file</label>
              <input type="file" id="fileInput" class="w-full text-sm text-gray-500 border border-gray-200 rounded-md p-1 cursor-pointer" />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">2. Save As (Filename)</label>
              <input type="text" id="pathInput" placeholder="index.html" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm font-mono text-sm" />
            </div>

            <button onclick="saveToLocal()" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-2.5 px-4 rounded-md shadow transition-colors">
              💾 Save File
            </button>
            
            <div id="statusMessage" class="hidden mt-4 p-3 rounded-md text-sm font-medium text-center"></div>
          </div>
        </div>
      </div>
      
    </div>
  </main>

  <script>
    const PREFIX = 'gitspace_file_';

    // Load files when the page opens
    window.onload = loadFiles;

    function saveToLocal() {
      const fileInput = document.getElementById('fileInput').files[0];
      let pathInput = document.getElementById('pathInput').value.trim();
      const statusBox = document.getElementById('statusMessage');

      statusBox.className = "mt-4 p-3 rounded-md text-sm font-medium text-center block";

      if (!fileInput || !pathInput) {
        statusBox.classList.add("bg-red-50", "text-red-700");
        statusBox.innerText = "❌ Please select a file and enter a name.";
        return;
      }

      // Read the file contents
      const reader = new FileReader();
      
      reader.onload = function(event) {
        const fileContent = event.target.result;
        
        // Save to browser's Local Storage
        localStorage.setItem(PREFIX + pathInput, fileContent);
        
        statusBox.classList.remove("bg-red-50", "text-red-700");
        statusBox.classList.add("bg-green-50", "text-green-700");
        statusBox.innerText = "✅ Saved " + pathInput + " to browser!";
        
        // Reset inputs and refresh the list
        document.getElementById('fileInput').value = "";
        document.getElementById('pathInput').value = "";
        loadFiles();
      };

      // Read as text (best for code files like HTML, CSS, JS)
      reader.readAsText(fileInput);
    }

    function loadFiles() {
      const fileList = document.getElementById('fileList');
      fileList.innerHTML = ''; // Clear the list first
      
      let hasFiles = false;

      // Loop through everything in Local Storage
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        
        // Only show files saved by GitSpace
        if (key.startsWith(PREFIX)) {
          hasFiles = true;
          const fileName = key.replace(PREFIX, '');
          const fileContent = localStorage.getItem(key);
          const fileSize = new Blob([fileContent]).size; // Get rough byte size

          const li = document.createElement('li');
          li.className = "px-4 py-3 flex items-center justify-between hover:bg-gray-50 transition-colors";
          li.innerHTML = `
            <div class="flex items-center space-x-3">
              <span class="text-blue-500 text-lg">📄</span>
              <span class="font-mono text-sm text-gray-800 font-medium">${fileName}</span>
              <span class="text-xs text-gray-400 ml-2 border border-gray-200 rounded px-1">${fileSize} bytes</span>
            </div>
            <button onclick="viewFile('${fileName}')" class="text-xs bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-1 rounded">View Code</button>
          `;
          fileList.appendChild(li);
        }
      }

      if (!hasFiles) {
        fileList.innerHTML = '<li class="px-4 py-8 text-center text-gray-500 text-sm">No files saved yet. Upload one to get started!</li>';
      }
    }

    function viewFile(fileName) {
      const content = localStorage.getItem(PREFIX + fileName);
      alert(`--- ${fileName} ---\n\n${content}`);
    }

    function clearAllFiles() {
      if(confirm("Are you sure? This will delete all files from your browser's memory.")) {
        // Find and remove only GitSpace files
        const keysToRemove = [];
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (key.startsWith(PREFIX)) keysToRemove.push(key);
        }
        keysToRemove.forEach(k => localStorage.removeItem(k));
        
        loadFiles();
      }
    }
  </script>

</body>
</html>
