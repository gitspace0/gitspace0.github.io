<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitSpace | Multi-Entry IDE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .editor-bg { background: #1e1e1e; color: #d4d4d4; }
        .terminal-bg { background: #000; color: #00FF00; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #2d2d2d; }
        ::-webkit-scrollbar-thumb { background: #666; border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 font-sans antialiased min-h-screen flex flex-col">

    <header class="bg-gray-900 text-white p-4 shadow-xl flex justify-between items-center border-b border-gray-700">
        <div class="flex items-center space-x-3">
            <div class="bg-blue-600 p-2 rounded-lg">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 10l-2 1m0 0l-2-1m2 1v2.5M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
            </div>
            <h1 class="text-xl font-bold tracking-tighter">GitSpace <span class="text-xs font-light text-gray-400 ml-1 italic">v4.0 Pages+</span></h1>
        </div>

        <div class="flex items-center space-x-4">
            <div class="flex flex-col items-end mr-2">
                <span class="text-[10px] uppercase text-gray-500 font-bold tracking-widest">Active Space</span>
                <select id="spaceSelector" onchange="switchSpace()" class="bg-transparent text-blue-400 text-sm font-mono border-none outline-none cursor-pointer">
                </select>
            </div>
            <button onclick="createNewSpace()" class="bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded text-xs transition-all">+ New Space</button>
            <button onclick="exportSpace()" class="bg-purple-600 hover:bg-purple-700 px-3 py-1 rounded text-xs font-bold">Export .JSON</button>
        </div>
    </header>

    <main class="flex-grow flex overflow-hidden">
        
        <aside class="w-64 bg-gray-800 border-r border-gray-700 flex flex-col">
            <div class="p-4 bg-gray-900 flex justify-between items-center border-b border-gray-800">
                <span class="text-xs font-bold text-gray-400 uppercase tracking-widest">Explorer</span>
                <button onclick="newFile()" class="text-blue-400 hover:text-white text-lg font-bold">+</button>
            </div>
            <ul id="fileList" class="flex-grow overflow-y-auto py-2"></ul>
            <div class="p-4 border-t border-gray-700">
                <button onclick="launchPagesMode()" class="w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded text-sm font-bold shadow-lg transition-all">
                    🚀 Launch Pages
                </button>
                <p class="text-[9px] text-gray-500 mt-2 text-center">Supports index.html, main.sbfb, main.txt</p>
            </div>
        </aside>

        <section class="flex-grow flex flex-col bg-gray-900">
            <div class="bg-gray-800 p-2 flex items-center space-x-2 border-b border-gray-700">
                <input type="text" id="activeFilename" onkeyup="updateUIForFile(this.value)" placeholder="index.html" class="bg-transparent text-gray-300 text-sm font-mono px-2 py-1 outline-none border-b border-gray-600 focus:border-blue-500 w-64">
                <button onclick="saveActiveFile()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-1 rounded text-xs font-bold">Save</button>
                <button onclick="copyBlobLink()" class="bg-gray-700 hover:bg-gray-600 text-gray-300 px-3 py-1 rounded text-xs font-bold">🔗 Copy Blob Link</button>
                <div id="langIndicator" class="text-[10px] font-bold px-2 py-1 rounded bg-gray-700 text-gray-400 uppercase">RAW</div>
                <button id="runSbfbBtn" onclick="runSbfb()" class="hidden bg-yellow-500 hover:bg-yellow-400 text-black px-4 py-1 rounded text-xs font-bold ml-auto">▶ RUN SBFB</button>
            </div>
            <textarea id="editor" spellcheck="false" class="flex-grow p-6 editor-bg font-mono text-sm outline-none resize-none" placeholder="Write code here..."></textarea>
        </section>

        <aside class="w-96 bg-black border-l border-gray-700 flex flex-col">
            <div class="bg-gray-900 p-3 text-xs font-bold text-gray-400 border-b border-gray-700 flex justify-between items-center">
                <span>TERMINAL / PREVIEW</span>
                <button onclick="document.getElementById('terminal').innerHTML=''" class="text-[10px] text-gray-500 hover:text-white">CLEAR</button>
            </div>
            <div id="terminal" class="flex-grow p-4 terminal-bg font-mono text-xs overflow-y-auto whitespace-pre-wrap">Terminal ready...</div>
            <div class="h-1/2 bg-white border-t-4 border-gray-800 relative">
                <iframe id="preview" class="w-full h-full bg-white"></iframe>
            </div>
        </aside>

    </main>

    <script>
        const KEY_PREFIX = "GS_v4_";
        let currentSpace = localStorage.getItem("GS_ACTIVE_SPACE") || "default-repo";
        let memory = {};
        let htmlContent = "";

        window.onload = () => {
            initSpaces();
            refreshFileList();
            switchSpace(currentSpace);
        };

        function initSpaces() {
            let spaces = JSON.parse(localStorage.getItem("GS_SPACES") || '["default-repo"]');
            const selector = document.getElementById("spaceSelector");
            selector.innerHTML = "";
            spaces.forEach(s => {
                const opt = document.createElement("option");
                opt.value = s; opt.innerText = s;
                if(s === currentSpace) opt.selected = true;
                selector.appendChild(opt);
            });
        }

        function createNewSpace() {
            let name = prompt("Space Name:");
            if(!name) return;
            name = name.trim().replace(/\s+/g, '-').toLowerCase();
            let spaces = JSON.parse(localStorage.getItem("GS_SPACES") || '["default-repo"]');
            if(!spaces.includes(name)) {
                spaces.push(name);
                localStorage.setItem("GS_SPACES", JSON.stringify(spaces));
            }
            switchSpace(name);
            initSpaces();
        }

        function switchSpace(name) {
            currentSpace = name || document.getElementById("spaceSelector").value;
            localStorage.setItem("GS_ACTIVE_SPACE", currentSpace);
            document.getElementById("editor").value = "";
            document.getElementById("activeFilename").value = "";
            refreshFileList();
        }

        function refreshFileList() {
            const list = document.getElementById("fileList");
            list.innerHTML = "";
            const prefix = `${KEY_PREFIX}${currentSpace}_`;
            for(let i=0; i<localStorage.length; i++){
                const key = localStorage.key(i);
                if(key.startsWith(prefix)){
                    const filename = key.replace(prefix, "");
                    const li = document.createElement("li");
                    li.className = "px-4 py-2 hover:bg-gray-700 cursor-pointer flex justify-between group";
                    const isSbfb = filename.endsWith(".sbfb");
                    li.innerHTML = `<div onclick="loadFile('${filename}')" class="flex items-center space-x-2 truncate">
                        <span class="${isSbfb ? 'text-yellow-400' : 'text-blue-400'}">${isSbfb ? '⚡' : '📄'}</span>
                        <span class="text-xs text-gray-300 font-mono">${filename}</span>
                    </div>
                    <button onclick="deleteFile('${filename}')" class="text-red-500 opacity-0 group-hover:opacity-100 px-2">×</button>`;
                    list.appendChild(li);
                }
            }
        }

        function saveActiveFile() {
            const name = document.getElementById("activeFilename").value.trim();
            const content = document.getElementById("editor").value;
            if(!name) return alert("Filename required!");
            localStorage.setItem(`${KEY_PREFIX}${currentSpace}_${name}`, content);
            refreshFileList();
            updateUIForFile(name);
        }

        function loadFile(name) {
            document.getElementById("editor").value = localStorage.getItem(`${KEY_PREFIX}${currentSpace}_${name}`);
            document.getElementById("activeFilename").value = name;
            updateUIForFile(name);
        }

        function updateUIForFile(name) {
            const indicator = document.getElementById("langIndicator");
            const runBtn = document.getElementById("runSbfbBtn");
            if(name.endsWith(".sbfb")) {
                indicator.innerText = "SBFB"; indicator.className = "text-[10px] font-bold px-2 py-1 rounded bg-yellow-900 text-yellow-400";
                runBtn.classList.remove("hidden");
            } else if (name.endsWith(".html")) {
                indicator.innerText = "HTML"; indicator.className = "text-[10px] font-bold px-2 py-1 rounded bg-blue-900 text-blue-400";
                runBtn.classList.add("hidden");
            } else {
                indicator.innerText = "RAW"; indicator.className = "text-[10px] font-bold px-2 py-1 rounded bg-gray-700 text-gray-400";
                runBtn.classList.add("hidden");
            }
        }

        function deleteFile(name) {
            if(confirm(`Delete ${name}?`)) {
                localStorage.removeItem(`${KEY_PREFIX}${currentSpace}_${name}`);
                refreshFileList();
            }
        }

        function newFile() {
            document.getElementById("activeFilename").value = "";
            document.getElementById("editor").value = "";
            updateUIForFile("");
        }

        // --- SBFB ENGINE ---
        async function runSbfb(silent = false) {
            const code = document.getElementById("editor").value;
            const terminal = document.getElementById("terminal");
            const preview = document.getElementById("preview");
            if(!silent) terminal.innerHTML = ">>> SBFB START\n";
            htmlContent = ""; memory = {};
            let isRunning = false;
            const lines = code.split("\n");
            async function exec(linesArr) {
                for(let i=0; i<linesArr.length; i++) {
                    let line = linesArr[i].trim();
                    let lower = line.toLowerCase();
                    if(lower === "start:sbfb") { isRunning = true; continue; }
                    if(lower === "<end:sbfb>") { isRunning = false; break; }
                    if(isRunning && line !== "") {
                        if(lower.startsWith("let ") || (line.includes("=") && !line.includes("=="))) {
                            let parts = line.replace(/^let\s+/i, '').split("=");
                            let varName = parts[0].trim();
                            let expr = parts[1].trim();
                            if(expr.startsWith('"')) memory[varName] = expr.replace(/"/g, '');
                            else {
                                let evalStr = expr;
                                for(let k in memory) evalStr = evalStr.replace(new RegExp(`\\b${k}\\b`, "g"), memory[k]);
                                try { memory[varName] = eval(evalStr); } catch { memory[varName] = expr; }
                            }
                        }
                        if(lower.startsWith("type (") && line.endsWith(")")) {
                            let val = line.substring(line.indexOf("(")+1, line.lastIndexOf(")")).trim();
                            let out = val.startsWith('"') ? val.replace(/"/g, '') : (memory[val] ?? val);
                            if(!silent) terminal.innerHTML += out + "\n";
                        }
                        if(lower.startsWith("render (") && line.endsWith(")")) {
                            let val = line.substring(line.indexOf("(")+1, line.lastIndexOf(")")).trim();
                            htmlContent += val.startsWith('"') ? val.replace(/"/g, '') : (memory[val] || "");
                            preview.srcdoc = htmlContent;
                        }
                        if(lower.startsWith("repeat ") && lower.endsWith("{")) {
                            let countKey = lower.substring(7, lower.length-1).trim();
                            let count = isNaN(countKey) ? memory[countKey] : parseInt(countKey);
                            let subLines = []; let depth = 1; i++;
                            while(i < linesArr.length && depth > 0) {
                                if(linesArr[i].includes("{")) depth++;
                                if(linesArr[i].includes("}")) depth--;
                                if(depth > 0) subLines.push(linesArr[i]); i++;
                            }
                            i--; for(let l=0; l<count; l++) await exec(subLines);
                        }
                    }
                }
            }
            await exec(lines);
            if(!silent) terminal.innerHTML += ">>> FINISHED";
            return htmlContent;
        }

        // --- SMART PAGES MODE ---
        async function getPagesContent() {
            const active = document.getElementById("activeFilename").value;
            const editorCode = document.getElementById("editor").value;

            // 1. If currently editing a valid entry file, use that.
            if(active === "index.html" || active === "main.txt") return editorCode;
            if(active === "main.sbfb") return await runSbfb(true);

            // 2. Otherwise search the space in priority order.
            const indexHtml = localStorage.getItem(`${KEY_PREFIX}${currentSpace}_index.html`);
            if(indexHtml) return indexHtml;

            const mainSbfb = localStorage.getItem(`${KEY_PREFIX}${currentSpace}_main.sbfb`);
            if(mainSbfb) {
                // To run a stored file, we briefly swap it into the editor
                const currentEdit = document.getElementById("editor").value;
                document.getElementById("editor").value = mainSbfb;
                const result = await runSbfb(true);
                document.getElementById("editor").value = currentEdit; // swap back
                return result;
            }

            const mainTxt = localStorage.getItem(`${KEY_PREFIX}${currentSpace}_main.txt`);
            if(mainTxt) return mainTxt;

            return null;
        }

        async function launchPagesMode() {
            const content = await getPagesContent();
            if(!content) return alert("Missing entry file! Create index.html, main.sbfb, or main.txt.");
            const blob = new Blob([content], { type: 'text/html' });
            window.open(URL.createObjectURL(blob), '_blank');
        }

        async function copyBlobLink() {
            const content = await getPagesContent();
            if(!content) return alert("Save index.html, main.sbfb, or main.txt first!");
            const blob = new Blob([content], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            navigator.clipboard.writeText(url).then(() => alert("Unique Link Copied:\n" + url));
        }

        function exportSpace() {
            const data = {};
            const prefix = `${KEY_PREFIX}${currentSpace}_`;
            for(let i=0; i<localStorage.length; i++){
                const k = localStorage.key(i);
                if(k.startsWith(prefix)) data[k.replace(prefix, "")] = localStorage.getItem(k);
            }
            const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = `${currentSpace}.json`;
            a.click();
        }
    </script>
</body>
</html>
